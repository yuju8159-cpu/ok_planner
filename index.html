<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沖繩旅遊小幫手</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        input, select, textarea {
            font-size: 16px; /* Prevent zoom on iOS */
        }
        @keyframes slide-up {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        .animate-slide-up {
            animation: slide-up 0.3s ease-out forwards;
        }
        
        /* Custom Scrollbar for Desktop */
        @media (min-width: 768px) {
            ::-webkit-scrollbar {
                width: 8px;
                height: 8px;
            }
            ::-webkit-scrollbar-track {
                background: transparent; 
            }
            ::-webkit-scrollbar-thumb {
                background: #cbd5e1; 
                border-radius: 4px;
            }
            ::-webkit-scrollbar-thumb:hover {
                background: #94a3b8; 
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- Icons Components ---
        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                if (window.lucide) window.lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} width={size} height={size} className={className}></i>;
        };

        // --- Helper Functions ---
        const generateId = () => Math.random().toString(36).substr(2, 9);
        
        const parseUrl = (text) => {
            if (!text) return text;
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return text.split(urlRegex).map((part, i) => {
                if (part.match(urlRegex)) {
                    return <a key={i} href={part} target="_blank" rel="noopener noreferrer" className="text-blue-600 underline break-all block my-1 hover:text-blue-800">🔗 {part}</a>;
                }
                return part;
            });
        };

        // --- Initial Data Loaded from Google Sheet (Updated with User's Itinerary, No Times) ---
        const IMPORTED_DAYS = [
            { id: 'd1', date: '2025-03-17', note: '抵達沖繩 / 中部' },
            { id: 'd2', date: '2025-03-18', note: '北部觀光 / 古宇利島' },
            { id: 'd3', date: '2025-03-19', note: '往南部移動 / 國際通' },
            { id: 'd4', date: '2025-03-20', note: '那霸市區 / 瀨長島' },
            { id: 'd5', date: '2025-03-21', note: '回程 / 免稅採購' },
        ];

        // Instead of time, we use 'order' to keep the sequence
        const IMPORTED_EVENTS = [
            // Day 1: 3/17
            { id: 'e1-1', dayId: 'd1', order: 1, title: '華航CI120班機到沖繩', location: '桃園國際機場', mapUrl: '', note: '搭乘08:10班機' },
            { id: 'e1-2', dayId: 'd1', order: 2, title: 'OTS租車服務中心取車', location: 'OTS租車 臨空豐崎營業所', mapUrl: '', note: '到達沖繩出關後搭OTS接駁車前往' },
            { id: 'e1-3', dayId: 'd1', order: 3, title: '魚屋直營食堂吃午餐', location: '魚屋直營食堂', mapUrl: '', note: '約10~15分鐘到達' },
            { id: 'e1-4', dayId: 'd1', order: 4, title: '港川外人住宅', location: '港川外人住宅', mapUrl: '', note: '約30分鐘到達' },
            { id: 'e1-5', dayId: 'd1', order: 5, title: '永旺夢樂城', location: 'AEON MALL Okinawa Rycom', mapUrl: '', note: '約36分鐘到達' },
            { id: 'e1-6', dayId: 'd1', order: 6, title: 'Vessel花苑飯店辦理入住', location: 'Vessel Hotel Campana Okinawa', mapUrl: '', note: '約45分鐘到達' },
            { id: 'e1-7', dayId: 'd1', order: 7, title: '美國村逛街含吃晚餐', location: '美國村', mapUrl: '', note: '晚上行程' },

            // Day 2: 3/18
            { id: 'e2-1', dayId: 'd2', order: 1, title: '許田休息站', location: '道の駅 許田', mapUrl: '', note: '飯店吃完早餐後前往 (約60分鐘到達)' },
            { id: 'e2-2', dayId: 'd2', order: 2, title: '古宇利島海洋塔', location: '古宇利海洋塔', mapUrl: '', note: '約40分鐘到達' },
            { id: 'e2-3', dayId: 'd2', order: 3, title: '古宇利島蝦蝦飯 / Shirasa食堂', location: '古宇利島蝦蝦飯', mapUrl: '', note: '品嚐蝦蝦飯(3分鐘到達)，至Shirasa食堂吃午餐海膽飯(約2分鐘到達)' },
            { id: 'e2-4', dayId: 'd2', order: 4, title: 'Shinmei Coffee', location: 'Shinmei Coffee', mapUrl: '', note: '約15分鐘到達' },
            { id: 'e2-5', dayId: 'd2', order: 5, title: '名護鳳梨園', location: '名護鳳梨園', mapUrl: '', note: '約15分鐘到達' },
            { id: 'e2-6', dayId: 'd2', order: 6, title: 'PANCHORI-NA麵包店', location: 'PANCHORI-NA', mapUrl: '', note: '約11分鐘到達' },
            { id: 'e2-7', dayId: 'd2', order: 7, title: '部瀨名海中公園觀景台', location: '部瀨名海中公園', mapUrl: '', note: '約25分鐘到達' },
            { id: 'e2-8', dayId: 'd2', order: 8, title: '萬座毛', location: '萬座毛', mapUrl: '', note: '約25分鐘到達' },
            { id: 'e2-9', dayId: 'd2', order: 9, title: '燒肉五苑吃晚餐', location: '燒肉五苑', mapUrl: '', note: '約45分鐘到達 (開2桌，1桌吃牛、1桌不吃牛)' },
            { id: 'e2-10', dayId: 'd2', order: 10, title: '回Vessel花苑飯店 / 美國村', location: '美國村', mapUrl: '', note: '回飯店，美國村逛街(Shopping) (約15分鐘到達)' },

            // Day 3: 3/19
            { id: 'e3-1', dayId: 'd3', order: 1, title: '琉球村', location: '琉球村', mapUrl: '', note: '飯店吃完早餐辦理退房前往 (約35分鐘到達)' },
            { id: 'e3-2', dayId: 'd3', order: 2, title: '浜の家海鮮料理吃午餐', location: '浜の家海鮮料理', mapUrl: '', note: '約5分鐘到達' },
            { id: 'e3-3', dayId: 'd3', order: 3, title: 'PARCO CITY', location: 'PARCO CITY', mapUrl: '', note: '約45分鐘到達' },
            { id: 'e3-4', dayId: 'd3', order: 4, title: '國際通大和Roynet飯店辦理入住', location: 'Daiwa Roynet Hotel Naha Kokusai-dori', mapUrl: '', note: '約25分鐘到達' },
            { id: 'e3-5', dayId: 'd3', order: 5, title: '逛國際通含晚餐', location: '國際通', mapUrl: '', note: '晚上逛街(Shopping)' },

            // Day 4: 3/20
            { id: 'e4-1', dayId: 'd4', order: 1, title: '達摩寺 (Sairaiin)', location: '達摩寺 西来院', mapUrl: '', note: '飯店吃完早餐後前往 (約15分鐘到達)' },
            { id: 'e4-2', dayId: 'd4', order: 2, title: '首里城', location: '首里城', mapUrl: '', note: '約5分鐘到達' },
            { id: 'e4-3', dayId: 'd4', order: 3, title: '琉球玻璃村', location: '琉球玻璃村', mapUrl: '', note: '約40分鐘到達' },
            { id: 'e4-4', dayId: 'd4', order: 4, title: 'DMM水族館', location: 'DMM Kariyushi水族館', mapUrl: '', note: '約15分鐘到達' },
            { id: 'e4-5', dayId: 'd4', order: 5, title: '瀨長島', location: '瀨長島 Umikaji Terrace', mapUrl: '', note: '約8分鐘到達' },
            { id: 'e4-6', dayId: 'd4', order: 6, title: '回國際通大和Roynet飯店', location: 'Daiwa Roynet Hotel Naha Kokusai-dori', mapUrl: '', note: '約35分鐘到達' },
            { id: 'e4-7', dayId: 'd4', order: 7, title: '逛國際通含晚餐', location: '國際通', mapUrl: '', note: '晚上逛街(Shopping)' },

            // Day 5: 3/21
            { id: 'e5-1', dayId: 'd5', order: 1, title: '波上宮', location: '波上宮', mapUrl: '', note: '飯店吃完早餐後前往 (約12分鐘到達)' },
            { id: 'e5-2', dayId: 'd5', order: 2, title: '回飯店整理行李並辦理退房', location: 'Daiwa Roynet Hotel Naha Kokusai-dori', mapUrl: '', note: '約12分鐘到達' },
            { id: 'e5-3', dayId: 'd5', order: 3, title: '回OTS還車', location: 'OTS租車 臨空豐崎營業所', mapUrl: '', note: '約30分鐘到達' },
            { id: 'e5-4', dayId: 'd5', order: 4, title: '那霸機場寄放行李', location: '那霸機場', mapUrl: '', note: '搭接駁車前往' },
            { id: 'e5-5', dayId: 'd5', order: 5, title: '第一牧志公設市場', location: '第一牧志公設市場', mapUrl: '', note: '搭單軌前往' },
            { id: 'e5-6', dayId: 'd5', order: 6, title: '歌町DFS免稅商店', location: 'T Galleria by DFS, Okinawa', mapUrl: '', note: '搭單軌前往' },
            { id: 'e5-7', dayId: 'd5', order: 7, title: '那霸機場拿行李等掛行李', location: '那霸機場', mapUrl: '', note: '搭單軌回機場' },
            { id: 'e5-8', dayId: 'd5', order: 8, title: '華航飛機回台灣', location: '那霸機場', mapUrl: '', note: '搭乘20:20飛機' },
        ];

        const DEFAULT_CHECKLIST = [
            { id: '1', text: '護照 (有效期6個月以上)', checked: false },
            { id: '2', text: 'VJW (Visit Japan Web) 登錄截圖', checked: false },
            { id: '3', text: '日幣現金 / 信用卡 (海外回饋卡)', checked: false },
            { id: '4', text: '駕照正本 + 駕照日文譯本 (自駕必備)', checked: false },
            { id: '5', text: '行動電源 / 充電線 / 網卡', checked: false },
            { id: '6', text: '個人藥品 / 暈車藥 / 腸胃藥', checked: false },
        ];

        const INITIAL_MEMO = `🌤️ 天氣預報 (3/17~3/21)：\n氣溫約 16度～23度左右\n(建議帶薄長袖與防風外套)\n\n🚗 租車注意：\n1. 日本為右駕靠左行駛\n2. 轉彎時務必記得「左轉拐小彎，右轉拐大彎」\n3. 遇到「止まれ」標誌務必完全煞停\n\n🍽️ 餐廳筆記：\n- 燒肉五苑：已確認分2桌(1桌牛/1桌不吃牛)\n- 古宇利島：蝦蝦飯跟海膽飯(Shirasa食堂)距離很近`;

        const INFO_LINKS = {
            weather: "https://www.jma.go.jp/bosai/forecast/#area_type=offices&area_code=471000",
            embassy: "https://www.roc-taiwan.org/jpna/index.html",
        };

        // --- Main App Component ---
        const App = () => {
            // --- State ---
            const [activeTab, setActiveTab] = useState('itinerary');
            
            // Data States
            const [travelers, setTravelers] = useState(['我', '旅伴A']);
            const [days, setDays] = useState(IMPORTED_DAYS); 
            const [events, setEvents] = useState(IMPORTED_EVENTS); 
            const [expenses, setExpenses] = useState([]); 
            const [currency, setCurrency] = useState({ rate: 0.21, symbol: 'JPY' });
            const [checklist, setChecklist] = useState(DEFAULT_CHECKLIST);
            const [memo, setMemo] = useState(INITIAL_MEMO);
            
            // --- Persistence ---
            useEffect(() => {
                const load = (key, setter, defaultVal) => {
                    const saved = localStorage.getItem(`okinawa_notime_${key}`);
                    if (saved) {
                        setter(JSON.parse(saved));
                    } else if (defaultVal) {
                        setter(defaultVal);
                    }
                };
                load('travelers', setTravelers, ['我', '旅伴A']);
                load('days', setDays, IMPORTED_DAYS);
                load('events', setEvents, IMPORTED_EVENTS);
                load('expenses', setExpenses, []);
                load('currency', setCurrency, { rate: 0.21, symbol: 'JPY' });
                load('checklist', setChecklist, DEFAULT_CHECKLIST);
                load('memo', setMemo, INITIAL_MEMO);
            }, []);

            useEffect(() => {
                const save = (key, data) => localStorage.setItem(`okinawa_notime_${key}`, JSON.stringify(data));
                save('travelers', travelers);
                save('days', days);
                save('events', events);
                save('expenses', expenses);
                save('currency', currency);
                save('checklist', checklist);
                save('memo', memo);
            }, [travelers, days, events, expenses, currency, checklist, memo]);

            // --- Component Rendering ---
            const renderContent = () => {
                switch (activeTab) {
                    case 'itinerary': return <ItineraryView days={days} setDays={setDays} events={events} setEvents={setEvents} />;
                    case 'map': return <MapView events={events} />;
                    case 'money': return <MoneyView travelers={travelers} expenses={expenses} setExpenses={setExpenses} currency={currency} setCurrency={setCurrency} />;
                    case 'tools': return <ToolsView checklist={checklist} setChecklist={setChecklist} memo={memo} setMemo={setMemo} />;
                    case 'info': return <InfoView />;
                    case 'settings': return <SettingsView travelers={travelers} setTravelers={setTravelers} setExpenses={setExpenses} resetToImport={resetToImport} days={days} events={events} />;
                    default: return <ItineraryView />;
                }
            };

            const resetToImport = () => {
                if(confirm("確定要重置並載入 3/17~3/21 的無時間序專屬行程嗎？\n(您目前手動修改的行程將會被覆蓋)")) {
                    setDays(IMPORTED_DAYS);
                    setEvents(IMPORTED_EVENTS);
                    setMemo(INITIAL_MEMO);
                    alert("行程已成功更新！");
                    setActiveTab('itinerary');
                }
            };

            const NavItem = ({ id, icon, label }) => (
                <button 
                    onClick={() => setActiveTab(id)}
                    className={`flex items-center gap-3 px-4 py-3 rounded-xl transition-all w-full text-left ${
                        activeTab === id 
                        ? 'bg-blue-50 text-blue-600 font-bold shadow-sm' 
                        : 'text-gray-500 hover:bg-gray-100 hover:text-gray-700'
                    }`}
                >
                    <Icon name={icon} size={20} />
                    <span className="hidden md:inline">{label}</span>
                    <span className="md:hidden text-xs">{label}</span>
                </button>
            );

            const MobileNavItem = ({ id, icon, label }) => (
                <button 
                    onClick={() => setActiveTab(id)}
                    className={`flex flex-col items-center p-2 rounded-lg transition-colors ${activeTab === id ? 'text-blue-600' : 'text-gray-400 hover:text-blue-400'}`}
                >
                    <Icon name={icon} size={24} />
                    <span className="text-[10px] mt-1">{label}</span>
                </button>
            );

            return (
                <div className="flex h-screen w-full bg-slate-50 text-gray-900 overflow-hidden">
                    
                    {/* Desktop Sidebar (Left) */}
                    <aside className="hidden md:flex flex-col w-64 bg-white border-r border-gray-200 h-full shadow-sm z-20">
                        <div className="p-6">
                            <h1 className="text-2xl font-bold flex items-center gap-2 text-blue-600">
                                <Icon name="palmtree" size={28} /> 沖繩自由行
                            </h1>
                            <p className="text-xs text-gray-400 mt-1 pl-9">Okinawa 3/17 - 3/21</p>
                        </div>
                        <nav className="flex-1 px-4 space-y-2">
                            <NavItem id="itinerary" icon="list" label="行程規劃" />
                            <NavItem id="map" icon="map" label="地圖導航" />
                            <NavItem id="money" icon="wallet" label="記帳分帳" />
                            <NavItem id="tools" icon="clipboard-list" label="清單備忘" />
                            <NavItem id="info" icon="info" label="實用資訊" />
                            <NavItem id="settings" icon="settings" label="設定管理" />
                        </nav>
                        <div className="p-4 border-t border-gray-100 text-xs text-gray-400 text-center">
                            專屬行程版 v3.0 (無時間序)
                        </div>
                    </aside>

                    {/* Main Content Area */}
                    <main className="flex-1 flex flex-col h-full relative overflow-hidden w-full">
                        {/* Mobile Header */}
                        <header className="md:hidden bg-gradient-to-r from-cyan-500 to-blue-500 p-4 text-white shadow-md z-10 flex-shrink-0">
                            <h1 className="text-lg font-bold flex items-center justify-center gap-2">
                                <Icon name="palmtree" size={20} /> 沖繩自由行
                            </h1>
                        </header>

                        {/* Content Scroll Area */}
                        <div className="flex-1 overflow-y-auto overflow-x-hidden md:p-2">
                            <div className="max-w-6xl mx-auto h-full">
                                {renderContent()}
                            </div>
                        </div>

                        {/* Mobile Bottom Nav */}
                        <nav className="md:hidden bg-white border-t border-gray-200 flex justify-around p-2 pb-safe flex-shrink-0 z-10">
                            <MobileNavItem id="itinerary" icon="list" label="行程" />
                            <MobileNavItem id="map" icon="map" label="導航" />
                            <MobileNavItem id="money" icon="wallet" label="記帳" />
                            <MobileNavItem id="tools" icon="clipboard-list" label="清單" />
                            <MobileNavItem id="info" icon="info" label="資訊" />
                            <MobileNavItem id="settings" icon="settings" label="設定" />
                        </nav>
                    </main>
                </div>
            );
        };

        // --- 1. Itinerary View (Responsive Layout) ---
        const ItineraryView = ({ days, setDays, events, setEvents }) => {
            const [isEditingEvent, setIsEditingEvent] = useState(null);
            const [selectedDayId, setSelectedDayId] = useState(days.length > 0 ? days[0].id : null);

            useEffect(() => {
                if (days.length > 0) {
                     if (!selectedDayId || !days.find(d => d.id === selectedDayId)) {
                        setSelectedDayId(days[0].id);
                     }
                } else {
                    setSelectedDayId(null);
                }
            }, [days, selectedDayId]);

            const addDay = () => {
                const lastDate = days.length > 0 ? new Date(days[days.length - 1].date) : new Date();
                lastDate.setDate(lastDate.getDate() + 1);
                const newId = generateId();
                setDays([...days, { id: newId, date: lastDate.toISOString().split('T')[0], note: '' }]);
                setSelectedDayId(newId);
            };

            const removeDay = (id) => {
                if(confirm("確定刪除這一天嗎？行程也會被刪除。")) {
                    setDays(days.filter(d => d.id !== id));
                    setEvents(events.filter(e => e.dayId !== id));
                }
            };
            
            const handleSaveEvent = (eventData) => {
                if (eventData.id) {
                    setEvents(events.map(e => e.id === eventData.id ? eventData : e));
                } else {
                    // Find max order for the current day to append
                    const dayEvents = events.filter(e => e.dayId === selectedDayId);
                    const maxOrder = dayEvents.length > 0 ? Math.max(...dayEvents.map(e => e.order || 0)) : 0;
                    setEvents([...events, { ...eventData, order: maxOrder + 1, id: generateId() }]);
                }
                setIsEditingEvent(null);
            };

            const deleteEvent = (id) => {
                if(confirm("刪除此行程？")) setEvents(events.filter(e => e.id !== id));
            };

            const moveEvent = (eventId, direction) => {
                const dayEvents = events.filter(e => e.dayId === selectedDayId).sort((a,b) => (a.order || 0) - (b.order || 0));
                const index = dayEvents.findIndex(e => e.id === eventId);
                
                if (direction === 'up' && index > 0) {
                    const current = dayEvents[index];
                    const prev = dayEvents[index - 1];
                    setEvents(events.map(e => {
                        if (e.id === current.id) return { ...e, order: prev.order };
                        if (e.id === prev.id) return { ...e, order: current.order };
                        return e;
                    }));
                } else if (direction === 'down' && index < dayEvents.length - 1) {
                    const current = dayEvents[index];
                    const next = dayEvents[index + 1];
                    setEvents(events.map(e => {
                        if (e.id === current.id) return { ...e, order: next.order };
                        if (e.id === next.id) return { ...e, order: current.order };
                        return e;
                    }));
                }
            };

            const currentDay = days.find(d => d.id === selectedDayId);
            const dayEventsList = events.filter(e => e.dayId === currentDay?.id).sort((a,b) => (a.order || 0) - (b.order || 0));

            return (
                <div className="h-full flex flex-col md:flex-row md:gap-6 md:p-6 md:h-[calc(100vh-2rem)]">
                    {/* Day Selector */}
                    <div className="md:w-64 md:flex-shrink-0 flex-col flex bg-white md:rounded-2xl md:shadow-sm md:border border-gray-100 overflow-hidden sticky top-0 z-20 md:static">
                        <div className="md:hidden flex items-center gap-2 p-3 overflow-x-auto hide-scrollbar bg-white/95 backdrop-blur border-b border-gray-100">
                             {days.map((day, index) => (
                                <button
                                    key={day.id}
                                    onClick={() => setSelectedDayId(day.id)}
                                    className={`flex-shrink-0 px-4 py-2 rounded-full text-sm font-bold transition-all shadow-sm border whitespace-nowrap ${
                                        selectedDayId === day.id 
                                        ? 'bg-blue-500 text-white border-blue-600 ring-2 ring-blue-200' 
                                        : 'bg-white text-gray-600 border-gray-200'
                                    }`}
                                >
                                    Day {index + 1}
                                </button>
                            ))}
                             <button onClick={addDay} className="flex-shrink-0 w-9 h-9 rounded-full bg-blue-50 text-blue-600 border border-blue-200 flex items-center justify-center">
                                <Icon name="plus" size={18} />
                            </button>
                        </div>

                        <div className="hidden md:flex flex-col h-full">
                            <div className="p-4 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
                                <h3 className="font-bold text-gray-700">天數列表</h3>
                                <button onClick={addDay} className="text-blue-600 hover:bg-blue-100 p-1 rounded transition"><Icon name="plus" size={18} /></button>
                            </div>
                            <div className="flex-1 overflow-y-auto p-2 space-y-1">
                                {days.map((day, index) => (
                                    <button
                                        key={day.id}
                                        onClick={() => setSelectedDayId(day.id)}
                                        className={`w-full text-left px-4 py-3 rounded-lg text-sm font-medium transition-all flex flex-col ${
                                            selectedDayId === day.id 
                                            ? 'bg-blue-50 text-blue-700 border border-blue-100 shadow-sm' 
                                            : 'text-gray-600 hover:bg-gray-50'
                                        }`}
                                    >
                                        <div className="flex justify-between items-center w-full">
                                            <span>Day {index + 1}</span>
                                            <span className="text-xs opacity-70">{new Date(day.date).toLocaleDateString('zh-TW', {month:'numeric', day:'numeric'})}</span>
                                        </div>
                                        <div className="text-xs mt-1 truncate opacity-60 font-normal">{day.note}</div>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Content Area */}
                    <div className="flex-1 p-4 md:p-0 overflow-y-auto md:overflow-visible">
                        {!currentDay ? (
                            <div className="flex flex-col items-center justify-center h-64 text-gray-400">
                                <Icon name="calendar-off" size={48} className="mb-2 opacity-50"/>
                                <p>目前沒有行程</p>
                                <button onClick={addDay} className="text-blue-500 font-bold mt-2 md:hidden">新增第一天</button>
                            </div>
                        ) : (
                            <div className="animate-slide-up h-full flex flex-col">
                                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex-1 flex flex-col">
                                    <div className="bg-gray-50/50 p-4 flex flex-col md:flex-row md:justify-between md:items-center border-b border-gray-100 gap-3">
                                        <div className="flex items-center gap-3">
                                            <h2 className="text-xl font-bold text-blue-800">Day {days.findIndex(d=>d.id===currentDay.id)+1}</h2>
                                            <div className="flex items-center gap-2 bg-white px-3 py-1 rounded-full border border-gray-200">
                                                <Icon name="calendar" size={14} className="text-gray-400"/>
                                                <input 
                                                    type="date" 
                                                    value={currentDay.date} 
                                                    onChange={(e) => setDays(days.map(d => d.id === currentDay.id ? {...d, date: e.target.value} : d))}
                                                    className="bg-transparent text-sm font-medium text-gray-600 focus:outline-none focus:text-blue-600"
                                                />
                                            </div>
                                        </div>
                                        <div className="flex items-center gap-2 flex-1 md:flex-none">
                                            <input 
                                                type="text" 
                                                placeholder="輸入本日主題 (例如: 北部觀光)" 
                                                value={currentDay.note}
                                                onChange={(e) => setDays(days.map(d => d.id === currentDay.id ? {...d, note: e.target.value} : d))}
                                                className="bg-gray-100 border-none px-3 py-1.5 rounded-lg text-sm flex-1 md:w-48 outline-none focus:ring-2 focus:ring-blue-200"
                                            />
                                            <button onClick={() => removeDay(currentDay.id)} className="text-gray-400 hover:text-red-500 p-2 rounded-full hover:bg-red-50 transition-colors" title="刪除整天">
                                                <Icon name="trash-2" size={18}/>
                                            </button>
                                        </div>
                                    </div>
                                    
                                    <div className="p-4 space-y-3 flex-1 overflow-y-auto md:custom-scrollbar relative">
                                        {/* Vertical Timeline Line */}
                                        <div className="absolute left-8 md:left-9 top-8 bottom-8 w-0.5 bg-gray-100 z-0"></div>

                                        {dayEventsList.length === 0 && (
                                            <div className="flex flex-col items-center justify-center py-20 text-gray-300 gap-2 border-2 border-dashed border-gray-100 rounded-xl m-4 z-10 relative bg-white">
                                                <Icon name="map" size={32} className="opacity-20"/>
                                                <div className="text-sm italic">點擊下方按鈕新增第一個行程</div>
                                            </div>
                                        )}
                                        {dayEventsList.map((event, index) => (
                                            <div key={event.id} className="relative z-10 flex gap-4 items-start p-3 md:p-4 bg-white rounded-xl border border-gray-100 hover:border-blue-200 hover:shadow-md transition-all group ml-1">
                                                {/* Sequence Number Circle */}
                                                <div className="flex-shrink-0 w-8 h-8 rounded-full bg-blue-100 text-blue-700 font-bold flex items-center justify-center border-[3px] border-white shadow-sm relative z-20 mt-0.5">
                                                    {index + 1}
                                                </div>
                                                
                                                <div className="flex-1 min-w-0">
                                                    <div className="font-bold text-gray-800 text-lg">{event.title}</div>
                                                    {event.location && (
                                                        <a href={event.mapUrl || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(event.location)}`} 
                                                           target="_blank" 
                                                           className="text-sm text-gray-500 flex items-center gap-1 mt-1 hover:text-blue-600 transition-colors w-fit bg-gray-50 px-2 py-0.5 rounded-md">
                                                            <Icon name="map-pin" size={14} className="text-red-400"/> {event.location}
                                                        </a>
                                                    )}
                                                    {event.note && (
                                                        <div className="text-sm text-gray-600 mt-2 bg-blue-50/50 p-2.5 rounded-lg border border-blue-50 flex gap-2 items-start">
                                                            <Icon name="info" size={16} className="text-blue-400 flex-shrink-0 mt-0.5"/> 
                                                            <span className="leading-relaxed">{event.note}</span>
                                                        </div>
                                                    )}
                                                </div>
                                                
                                                {/* Actions */}
                                                <div className="flex flex-col gap-1 opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity bg-white/80 rounded-lg backdrop-blur-sm">
                                                    <div className="flex items-center justify-center bg-gray-50 rounded-md mb-1 border border-gray-100 overflow-hidden">
                                                        <button disabled={index === 0} onClick={() => moveEvent(event.id, 'up')} className="p-1 text-gray-400 hover:text-blue-500 hover:bg-gray-100 disabled:opacity-20"><Icon name="chevron-up" size={16}/></button>
                                                        <button disabled={index === dayEventsList.length - 1} onClick={() => moveEvent(event.id, 'down')} className="p-1 text-gray-400 hover:text-blue-500 hover:bg-gray-100 disabled:opacity-20"><Icon name="chevron-down" size={16}/></button>
                                                    </div>
                                                    <div className="flex gap-1 justify-end">
                                                        <button onClick={() => setIsEditingEvent(event)} className="text-gray-400 hover:text-blue-500 p-1.5 bg-gray-50 hover:bg-blue-50 rounded-md transition-colors"><Icon name="edit-2" size={16}/></button>
                                                        <button onClick={() => deleteEvent(event.id)} className="text-gray-400 hover:text-red-500 p-1.5 bg-gray-50 hover:bg-red-50 rounded-md transition-colors"><Icon name="x" size={16}/></button>
                                                    </div>
                                                </div>
                                            </div>
                                        ))}
                                        
                                        <button 
                                            onClick={() => setIsEditingEvent({ dayId: currentDay.id, title: '', location: '', mapUrl: '', note: '' })}
                                            className="w-full py-4 mt-6 rounded-xl border-2 border-dashed border-gray-200 text-gray-400 hover:border-blue-300 hover:text-blue-500 hover:bg-blue-50 transition-all text-sm font-bold flex items-center justify-center gap-2 relative z-10 bg-white"
                                        >
                                            <Icon name="plus-circle" size={18}/> 新增行程
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Edit Modal (No Time Input) */}
                    {isEditingEvent && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-end md:items-center justify-center p-4 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-lg rounded-2xl md:rounded-xl p-6 space-y-5 shadow-2xl animate-slide-up flex flex-col max-h-[90vh]">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <h3 className="font-bold text-xl text-gray-800">{isEditingEvent.id ? '編輯行程' : '新增行程'}</h3>
                                    <button onClick={() => setIsEditingEvent(null)} className="text-gray-400 hover:text-gray-600"><Icon name="x" size={24}/></button>
                                </div>
                                <div className="overflow-y-auto flex-1 space-y-4 pr-1">
                                    <div>
                                        <label className="text-sm font-bold text-gray-600 mb-1 block">名稱</label>
                                        <input type="text" placeholder="行程名稱" className="w-full bg-gray-50 border border-gray-200 rounded-lg p-2.5 focus:bg-white focus:ring-2 ring-blue-200 outline-none transition" value={isEditingEvent.title} onChange={e => setIsEditingEvent({...isEditingEvent, title: e.target.value})} />
                                    </div>
                                    
                                    <div>
                                        <label className="text-sm font-bold text-gray-600 mb-1 block">地點</label>
                                        <div className="relative">
                                            <Icon name="map-pin" size={18} className="absolute left-3 top-3 text-gray-400"/>
                                            <input type="text" placeholder="搜尋地點或輸入名稱" className="w-full pl-10 bg-gray-50 border border-gray-200 rounded-lg p-2.5 focus:bg-white focus:ring-2 ring-blue-200 outline-none transition" value={isEditingEvent.location || ''} onChange={e => setIsEditingEvent({...isEditingEvent, location: e.target.value})} />
                                        </div>
                                    </div>

                                    <div>
                                        <label className="text-sm font-bold text-gray-600 mb-1 block">地圖連結 (選填)</label>
                                        <input type="text" placeholder="貼上 Google Maps URL" className="w-full bg-gray-50 border border-gray-200 rounded-lg p-2.5 focus:bg-white focus:ring-2 ring-blue-200 outline-none transition text-sm" value={isEditingEvent.mapUrl || ''} onChange={e => setIsEditingEvent({...isEditingEvent, mapUrl: e.target.value})} />
                                    </div>

                                    <div>
                                        <label className="text-sm font-bold text-gray-600 mb-1 block">備註 (包含特定時間、車程)</label>
                                        <textarea placeholder="例如: 搭乘 08:10 班機 / 車程大約40分鐘" className="w-full h-24 bg-gray-50 border border-gray-200 rounded-lg p-2.5 focus:bg-white focus:ring-2 ring-blue-200 outline-none transition resize-none" value={isEditingEvent.note || ''} onChange={e => setIsEditingEvent({...isEditingEvent, note: e.target.value})}></textarea>
                                    </div>
                                </div>

                                <button onClick={() => handleSaveEvent(isEditingEvent)} className="w-full py-3 bg-blue-600 hover:bg-blue-700 rounded-xl text-white font-bold shadow-lg shadow-blue-200 active:scale-[0.98] transition-all">儲存行程</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- 2. Map Navigation View ---
        const MapView = ({ events }) => {
            const validEvents = events.filter(e => e.location || e.mapUrl);
            
            return (
                <div className="p-4 md:p-6 space-y-4">
                    <h2 className="text-2xl font-bold text-gray-800 hidden md:block">地圖導航</h2>
                    <div className="bg-yellow-50 text-yellow-800 p-4 rounded-xl text-sm border border-yellow-200 flex items-center gap-2 shadow-sm">
                        <Icon name="info" size={18}/>
                        提示：點擊按鈕直接開啟 Google Maps App 導航。
                    </div>
                    {validEvents.length === 0 ? (
                        <div className="text-center text-gray-400 py-20 bg-white rounded-2xl border border-gray-100 border-dashed">尚無行程地點資料，請先至行程表新增。</div>
                    ) : (
                        <div className="grid gap-4 md:grid-cols-2 lg:grid-cols-3">
                            {validEvents.map(e => {
                                const url = e.mapUrl || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.location)}`;
                                return (
                                    <a key={e.id} href={url} target="_blank" className="bg-white p-5 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between hover:bg-blue-50 hover:border-blue-200 transition group h-full">
                                        <div className="min-w-0 pr-2">
                                            <div className="font-bold text-gray-800 text-lg truncate mb-1 group-hover:text-blue-700">{e.title}</div>
                                            <div className="text-sm text-gray-500 truncate flex items-center gap-1">
                                                <Icon name="map-pin" size={14} className="flex-shrink-0 text-red-400"/> 
                                                <span className="truncate">{e.location}</span>
                                            </div>
                                        </div>
                                        <div className="bg-blue-100 text-blue-600 p-3 rounded-full flex-shrink-0 group-hover:bg-blue-600 group-hover:text-white transition-colors shadow-sm">
                                            <Icon name="navigation" size={20} />
                                        </div>
                                    </a>
                                );
                            })}
                        </div>
                    )}
                </div>
            );
        };

        // --- 3. Money View ---
        const MoneyView = ({ travelers, expenses, setExpenses, currency, setCurrency }) => {
            const [viewMode, setViewMode] = useState('list');
            const [newExpense, setNewExpense] = useState(null);

            const report = useMemo(() => {
                let balances = {};
                travelers.forEach(t => balances[t] = 0);
                
                let totalSpent = 0;
                let activeExpenses = expenses.filter(e => !e.settled);

                activeExpenses.forEach(exp => {
                    const amount = parseFloat(exp.amount);
                    if(isNaN(amount)) return;
                    totalSpent += amount;
                    if(balances[exp.payer] !== undefined) balances[exp.payer] += amount;
                    Object.entries(exp.splits).forEach(([person, splitAmount]) => {
                        if(balances[person] !== undefined) balances[person] -= parseFloat(splitAmount);
                    });
                });

                let debtors = [];
                let creditors = [];
                Object.entries(balances).forEach(([person, amount]) => {
                    if (amount < -0.1) debtors.push({ person, amount });
                    if (amount > 0.1) creditors.push({ person, amount });
                });

                debtors.sort((a, b) => a.amount - b.amount);
                creditors.sort((a, b) => b.amount - a.amount);

                let transfers = [];
                let i = 0; let j = 0;
                while (i < debtors.length && j < creditors.length) {
                    let debtor = debtors[i];
                    let creditor = creditors[j];
                    let amount = Math.min(Math.abs(debtor.amount), creditor.amount);
                    transfers.push({
                        from: debtor.person,
                        to: creditor.person,
                        amount: amount.toFixed(0)
                    });
                    debtor.amount += amount;
                    creditor.amount -= amount;
                    if (Math.abs(debtor.amount) < 0.1) i++;
                    if (creditor.amount < 0.1) j++;
                }
                return { totalSpent, transfers, balances };
            }, [expenses, travelers]);

            const initAddExpense = () => {
                const initialSplits = {};
                travelers.forEach(t => initialSplits[t] = 0); 
                setNewExpense({
                    id: generateId(),
                    date: new Date().toISOString().split('T')[0],
                    title: '',
                    amount: '',
                    payer: travelers[0],
                    splits: initialSplits,
                    splitType: 'equal', 
                    settled: false
                });
                setViewMode('add');
            };

            const saveExpense = () => {
                if (!newExpense.title || !newExpense.amount) return alert("請輸入項目和金額");
                const total = parseFloat(newExpense.amount);
                let finalSplits = {...newExpense.splits};
                if (newExpense.splitType === 'equal') {
                    const share = total / travelers.length;
                    travelers.forEach(t => finalSplits[t] = share);
                } else {
                    const currentSum = Object.values(finalSplits).reduce((a, b) => a + parseFloat(b || 0), 0);
                    if (Math.abs(currentSum - total) > 1) {
                        return alert(`金額錯誤！自訂分攤總和 (${currentSum}) 與 總金額 (${total}) 不符。`);
                    }
                }
                const expenseToSave = { ...newExpense, splits: finalSplits, amount: total };
                const existingIndex = expenses.findIndex(e => e.id === expenseToSave.id);
                if (existingIndex >= 0) {
                    const updated = [...expenses];
                    updated[existingIndex] = expenseToSave;
                    setExpenses(updated);
                } else {
                    setExpenses([expenseToSave, ...expenses]);
                }
                setViewMode('list');
            };

            const toggleSettle = (date) => {
                if(confirm(`確定將 ${date} 以前(含)的所有未結算項目標記為已結算？`)) {
                    setExpenses(expenses.map(e => {
                        if (e.date <= date && !e.settled) return { ...e, settled: true };
                        return e;
                    }));
                }
            };
            
            const deleteExpense = (id) => {
                if(confirm("確定要刪除此筆記帳紀錄嗎？")) {
                    setExpenses(prev => prev.filter(e => e.id !== id));
                }
            };

            const editExpense = (exp) => {
                const values = Object.values(exp.splits).map(v => parseFloat(v) || 0);
                const total = parseFloat(exp.amount) || 0;
                const avg = total / travelers.length;
                const isEqual = values.every(v => Math.abs(v - avg) < 1.0);
                
                let currentSplits = {...exp.splits};
                travelers.forEach(t => { if(currentSplits[t] === undefined) currentSplits[t] = 0; });

                setNewExpense({
                    ...exp, 
                    splitType: isEqual ? 'equal' : 'custom',
                    splits: currentSplits 
                });
                setViewMode('add');
            };

            if (viewMode === 'add') {
                const currentSplitSum = Object.values(newExpense.splits).reduce((a, b) => a + parseFloat(b || 0), 0);
                const remaining = parseFloat(newExpense.amount || 0) - currentSplitSum;

                return (
                    <div className="fixed inset-0 z-50 bg-white md:bg-black/50 md:flex md:items-center md:justify-center p-0 md:p-4">
                        <div className="h-full w-full md:h-auto md:max-w-2xl bg-white md:rounded-2xl flex flex-col shadow-2xl overflow-hidden animate-slide-up">
                            <div className="flex items-center p-4 border-b border-gray-100 bg-gray-50/50">
                                <button onClick={() => setViewMode('list')} className="mr-3 text-gray-500 hover:text-gray-800"><Icon name="arrow-left"/></button>
                                <h2 className="text-xl font-bold">{newExpense.id && expenses.find(e=>e.id === newExpense.id) ? '編輯記帳' : '新增記帳'}</h2>
                            </div>
                            <div className="flex-1 overflow-y-auto p-4 md:p-6 space-y-6">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="space-y-4">
                                        <div>
                                            <label className="text-sm font-bold text-gray-500 mb-1 block">日期</label>
                                            <input type="date" className="w-full border rounded-lg p-3 bg-gray-50 focus:bg-white focus:ring-2 ring-blue-100 outline-none transition" value={newExpense.date} onChange={e => setNewExpense({...newExpense, date: e.target.value})} />
                                        </div>
                                        <div>
                                            <label className="text-sm font-bold text-gray-500 mb-1 block">項目名稱</label>
                                            <input type="text" placeholder="例如: 晚餐" className="w-full border rounded-lg p-3 bg-gray-50 focus:bg-white focus:ring-2 ring-blue-100 outline-none transition text-lg" value={newExpense.title} onChange={e => setNewExpense({...newExpense, title: e.target.value})} />
                                        </div>
                                        <div className="flex gap-4">
                                            <div className="flex-1">
                                                <label className="text-sm font-bold text-gray-500 mb-1 block">總金額 ({currency.symbol})</label>
                                                <input type="number" placeholder="0" className="w-full border rounded-lg p-3 bg-gray-50 focus:bg-white focus:ring-2 ring-blue-100 outline-none transition text-2xl font-bold text-blue-600" value={newExpense.amount} onChange={e => setNewExpense({...newExpense, amount: e.target.value})} />
                                            </div>
                                            <div className="w-2/5">
                                                <label className="text-sm font-bold text-gray-500 mb-1 block">付款人</label>
                                                <select className="w-full border rounded-lg p-3 h-[58px] bg-gray-50 focus:bg-white focus:ring-2 ring-blue-100 outline-none transition" value={newExpense.payer} onChange={e => setNewExpense({...newExpense, payer: e.target.value})}>
                                                    {travelers.map(t => <option key={t} value={t}>{t}</option>)}
                                                </select>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="bg-gray-50 p-4 rounded-xl border border-gray-100 h-fit">
                                        <div className="flex justify-between mb-4">
                                            <label className="text-sm font-bold text-gray-700">分攤方式</label>
                                            <div className="flex bg-gray-200 rounded-lg p-1 text-xs">
                                                <button onClick={() => setNewExpense({...newExpense, splitType: 'equal'})} className={`px-3 py-1.5 rounded-md transition-all font-medium ${newExpense.splitType === 'equal' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>均分</button>
                                                <button onClick={() => setNewExpense({...newExpense, splitType: 'custom'})} className={`px-3 py-1.5 rounded-md transition-all font-medium ${newExpense.splitType === 'custom' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`}>自訂</button>
                                            </div>
                                        </div>
                                        
                                        <div className="space-y-2">
                                            {newExpense.splitType === 'custom' ? (
                                                <>
                                                    {travelers.map(t => (
                                                        <div key={t} className="flex justify-between items-center bg-white p-2.5 rounded-lg border border-gray-200">
                                                            <span className="font-medium text-gray-700">{t}</span>
                                                            <input type="number" 
                                                                className="w-24 bg-gray-50 border-transparent rounded p-1 text-right font-mono focus:bg-white focus:ring-2 ring-blue-100 outline-none" 
                                                                value={newExpense.splits[t] || ''} 
                                                                onChange={(e) => setNewExpense({...newExpense, splits: {...newExpense.splits, [t]: e.target.value}})}
                                                            />
                                                        </div>
                                                    ))}
                                                    <div className={`text-xs text-right mt-3 font-bold ${Math.abs(remaining) > 1 ? 'text-red-500' : 'text-green-500'}`}>
                                                        {Math.abs(remaining) > 1 
                                                            ? `⚠️ 還有 ${remaining.toFixed(0)} 未分配`
                                                            : '✅ 金額分配正確'}
                                                    </div>
                                                </>
                                            ) : (
                                                <div className="text-center py-6 text-gray-500 bg-white rounded-lg border border-dashed border-gray-300">
                                                    <div className="text-xs mb-1">每人分攤</div>
                                                    <div className="font-bold text-3xl text-blue-600 font-mono">
                                                        {newExpense.amount ? (newExpense.amount / travelers.length).toFixed(0) : 0}
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div className="p-4 border-t border-gray-100 bg-gray-50/50">
                                <button onClick={saveExpense} className="w-full bg-blue-600 hover:bg-blue-700 text-white py-3.5 rounded-xl font-bold shadow-lg shadow-blue-200 active:scale-[0.98] transition-all">儲存紀錄</button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="p-4 md:p-6 pb-20 md:pb-6 h-full flex flex-col">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="text-2xl font-bold text-gray-800 hidden md:block">財務管家</h2>
                        <div className="flex gap-2 text-sm ml-auto">
                             <div className="flex items-center gap-2 bg-white px-3 py-1.5 rounded-lg border border-gray-200 shadow-sm">
                                <span className="text-xs text-gray-500 font-medium">匯率 1 :</span>
                                <input type="number" className="w-16 text-center border-b border-gray-300 focus:border-blue-500 outline-none font-mono" value={currency.rate} step="0.01" onChange={(e) => setCurrency({...currency, rate: parseFloat(e.target.value)})} />
                            </div>
                        </div>
                    </div>

                    <div className="grid md:grid-cols-12 gap-6 items-start">
                        <div className="md:col-span-5 lg:col-span-4 space-y-6 md:sticky md:top-0">
                            <div className="bg-gradient-to-br from-blue-600 to-cyan-500 rounded-2xl p-6 text-white shadow-xl relative overflow-hidden">
                                <div className="absolute top-0 right-0 p-3 opacity-10"><Icon name="wallet" size={100}/></div>
                                <div className="relative z-10">
                                    <div className="text-blue-100 text-sm font-medium mb-1">未結算總支出</div>
                                    <div className="text-4xl font-bold tracking-tight mb-2">¥ {report.totalSpent.toLocaleString()}</div>
                                    <div className="text-sm text-blue-100 bg-white/20 w-fit px-2 py-1 rounded backdrop-blur-sm">≈ NT$ {(report.totalSpent * currency.rate).toFixed(0)}</div>
                                    
                                    <div className="mt-6 pt-6 border-t border-white/20">
                                        <button onClick={initAddExpense} className="w-full bg-white text-blue-600 px-4 py-3 rounded-xl font-bold shadow-md hover:bg-blue-50 active:scale-95 transition-all flex items-center justify-center gap-2">
                                            <Icon name="plus" size={20} /> 記一筆
                                        </button>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="bg-white rounded-2xl p-5 shadow-sm border border-gray-100">
                                <h3 className="font-bold text-gray-700 mb-3 flex items-center gap-2"><Icon name="refresh-cw" size={18}/> 建議結算</h3>
                                {report.transfers.length > 0 ? (
                                    <div className="space-y-3">
                                        {report.transfers.map((t, idx) => (
                                            <div key={idx} className="flex justify-between items-center p-3 bg-gray-50 rounded-lg border border-gray-100">
                                                <div className="flex items-center gap-2 text-sm font-medium text-gray-700">
                                                    <span className="bg-white px-2 py-0.5 rounded border border-gray-200">{t.from}</span>
                                                    <Icon name="arrow-right" size={14} className="text-gray-400"/>
                                                    <span className="bg-white px-2 py-0.5 rounded border border-gray-200">{t.to}</span>
                                                </div>
                                                <div className="text-right">
                                                    <div className="font-bold text-blue-600 font-mono">¥{t.amount}</div>
                                                    <div className="text-xs text-gray-400">NT${(t.amount*currency.rate).toFixed(0)}</div>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="text-center py-4 text-gray-400 text-sm bg-gray-50 rounded-lg">目前無人欠款，完美！</div>
                                )}
                            </div>
                        </div>

                        <div className="md:col-span-7 lg:col-span-8 space-y-4">
                            <h3 className="font-bold text-gray-700 md:hidden">記帳紀錄</h3>
                            {Object.entries(expenses.reduce((acc, curr) => {
                                (acc[curr.date] = acc[curr.date] || []).push(curr);
                                return acc;
                            }, {})).sort((a,b) => b[0].localeCompare(a[0])).map(([date, items]) => {
                                const allSettled = items.every(i => i.settled);
                                return (
                                    <div key={date} className={`bg-white rounded-2xl shadow-sm overflow-hidden border transition-all ${allSettled ? 'opacity-60 grayscale border-gray-100' : 'border-gray-200 hover:border-blue-200'}`}>
                                        <div className="bg-gray-50 px-4 py-3 flex justify-between items-center text-sm border-b border-gray-100">
                                            <span className="font-bold text-gray-700 flex items-center gap-2">
                                                <Icon name="calendar" size={14} className="text-gray-400"/> {date}
                                            </span>
                                            {!allSettled ? (
                                                <button 
                                                    onClick={(e) => { e.stopPropagation(); toggleSettle(date); }} 
                                                    className="text-xs font-bold text-green-600 bg-green-50 px-3 py-1.5 rounded-full border border-green-200 hover:bg-green-100 transition-colors"
                                                >
                                                    結清此日之前
                                                </button>
                                            ) : (
                                                <span className="text-xs font-bold bg-gray-200 text-gray-500 px-3 py-1 rounded-full">已結算</span>
                                            )}
                                        </div>
                                        <div className="divide-y divide-gray-50">
                                            {items.map(exp => (
                                                <div key={exp.id} 
                                                     onClick={() => !exp.settled && editExpense(exp)}
                                                     className={`p-4 flex justify-between items-center group transition-colors ${!exp.settled ? 'hover:bg-blue-50/50 cursor-pointer' : ''}`}
                                                >
                                                    <div className="flex-1">
                                                        <div className="font-bold text-gray-800 text-base">{exp.title}</div>
                                                        <div className="text-xs text-gray-500 mt-1 flex items-center gap-2">
                                                            <span className="bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded font-medium">{exp.payer}</span>
                                                            <span>先付</span>
                                                        </div>
                                                    </div>
                                                    <div className="flex items-center gap-4">
                                                        <div className="font-mono font-bold text-gray-700">¥{parseFloat(exp.amount).toLocaleString()}</div>
                                                        {!exp.settled && (
                                                            <button 
                                                                onClick={(e) => { e.stopPropagation(); deleteExpense(exp.id); }} 
                                                                className="text-gray-300 hover:text-red-500 p-2 rounded-full hover:bg-red-50 md:opacity-0 group-hover:opacity-100 transition-all"
                                                            >
                                                                <Icon name="trash-2" size={18}/>
                                                            </button>
                                                        )}
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        // --- 4. Tools View ---
        const ToolsView = ({ checklist, setChecklist, memo, setMemo }) => {
            const toggleCheck = (id) => {
                setChecklist(checklist.map(i => i.id === id ? { ...i, checked: !i.checked } : i));
            };

            const addCheckItem = (e) => {
                if(e.key === 'Enter' && e.target.value.trim()) {
                    setChecklist([...checklist, { id: generateId(), text: e.target.value, checked: false }]);
                    e.target.value = '';
                }
            };

            const deleteCheckItem = (id) => {
                 setChecklist(checklist.filter(i => i.id !== id));
            }

            return (
                <div className="p-4 md:p-6 space-y-6 md:space-y-0 md:grid md:grid-cols-2 md:gap-8 h-full">
                    <div className="flex flex-col h-full">
                        <h2 className="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2"><Icon name="check-square" className="text-blue-500"/> 行前準備清單</h2>
                        <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden flex-1 flex flex-col">
                            <div className="p-3 bg-gray-50 border-b border-gray-200">
                                <input type="text" placeholder="+ 新增項目 (Enter)" onKeyDown={addCheckItem} className="w-full bg-white border border-gray-200 rounded-lg p-3 focus:outline-none focus:ring-2 ring-blue-100 transition" />
                            </div>
                            <div className="overflow-y-auto flex-1 p-2 space-y-1">
                                {checklist.map(item => (
                                    <div key={item.id} className="flex items-center p-3 hover:bg-gray-50 rounded-lg group transition-colors">
                                        <div className="relative flex items-center">
                                            <input 
                                                type="checkbox" 
                                                checked={item.checked} 
                                                onChange={() => toggleCheck(item.id)}
                                                className="peer appearance-none w-6 h-6 border-2 border-gray-300 rounded-md checked:bg-blue-500 checked:border-blue-500 transition-colors cursor-pointer"
                                            />
                                            <Icon name="check" size={14} className="absolute left-1 top-1 text-white opacity-0 peer-checked:opacity-100 pointer-events-none"/>
                                        </div>
                                        <span className={`flex-1 ml-3 text-base ${item.checked ? 'line-through text-gray-400' : 'text-gray-700'}`}>{item.text}</span>
                                        <button onClick={() => deleteCheckItem(item.id)} className="text-gray-300 hover:text-red-500 p-1 opacity-100 md:opacity-0 group-hover:opacity-100 transition-all"><Icon name="x" size={18}/></button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    <div className="flex flex-col h-full">
                        <h2 className="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2"><Icon name="file-text" className="text-yellow-500"/> 個人備忘錄</h2>
                        <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-1 flex-1 flex flex-col h-[400px] md:h-auto">
                            <textarea 
                                className="w-full p-4 resize-none focus:outline-none text-base text-gray-700 h-1/2 md:h-2/3 border-b border-dashed border-gray-200 rounded-t-xl"
                                placeholder="在此輸入筆記、餐廳連結..."
                                value={memo}
                                onChange={(e) => setMemo(e.target.value)}
                            ></textarea>
                            <div className="p-4 bg-yellow-50/30 text-sm text-gray-600 flex-1 rounded-b-xl overflow-y-auto">
                                <div className="text-xs font-bold text-gray-400 mb-2 uppercase tracking-wider">Preview Links</div>
                                {memo ? parseUrl(memo) : <span className="text-gray-400 italic">尚未輸入內容...</span>}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 5. Info View ---
        const InfoView = () => {
            return (
                <div className="p-4 md:p-8 space-y-8 max-w-4xl mx-auto">
                    <h2 className="text-2xl font-bold text-gray-800 hidden md:block border-b pb-4">實用資訊中心</h2>
                    
                    <div className="grid grid-cols-2 md:grid-cols-2 gap-4 md:gap-8">
                         <a href={INFO_LINKS.weather} target="_blank" className="group bg-gradient-to-br from-orange-400 to-red-500 text-white p-6 rounded-2xl shadow-lg hover:shadow-xl hover:scale-[1.02] transition-all flex flex-col items-center justify-center gap-3">
                            <Icon name="sun" size={48} className="drop-shadow-md"/>
                            <span className="font-bold text-lg md:text-xl">天氣預報</span>
                            <span className="text-xs md:text-sm opacity-80 bg-white/20 px-3 py-1 rounded-full group-hover:bg-white/30">查看一周天氣</span>
                        </a>
                        <a href={INFO_LINKS.embassy} target="_blank" className="group bg-gradient-to-br from-blue-500 to-indigo-600 text-white p-6 rounded-2xl shadow-lg hover:shadow-xl hover:scale-[1.02] transition-all flex flex-col items-center justify-center gap-3">
                            <Icon name="building-2" size={48} className="drop-shadow-md"/>
                            <span className="font-bold text-lg md:text-xl">辦事處</span>
                            <span className="text-xs md:text-sm opacity-80 bg-white/20 px-3 py-1 rounded-full group-hover:bg-white/30">緊急協助</span>
                        </a>
                    </div>

                    <div className="grid md:grid-cols-2 gap-6">
                        <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                            <h3 className="font-bold text-red-500 mb-4 flex items-center gap-2 text-lg"><Icon name="phone-call" size={20}/> 緊急聯絡</h3>
                            <ul className="space-y-4 text-gray-700">
                                <li className="flex justify-between items-center border-b border-gray-50 pb-2">
                                    <span className="flex items-center gap-2"><Icon name="shield-alert" size={16} className="text-gray-400"/> 警察局</span> 
                                    <span className="font-mono font-bold text-xl bg-red-50 text-red-600 px-3 py-1 rounded">110</span>
                                </li>
                                <li className="flex justify-between items-center border-b border-gray-50 pb-2">
                                    <span className="flex items-center gap-2"><Icon name="flame" size={16} className="text-gray-400"/> 火警/救護車</span> 
                                    <span className="font-mono font-bold text-xl bg-red-50 text-red-600 px-3 py-1 rounded">119</span>
                                </li>
                                <li className="flex justify-between items-center pt-2">
                                    <span className="flex items-center gap-2"><Icon name="globe" size={16} className="text-gray-400"/> 外交部緊急聯絡</span> 
                                    <span className="font-mono font-bold text-lg text-gray-800">080-1009-7179</span>
                                </li>
                            </ul>
                        </div>

                        <div className="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
                            <h3 className="font-bold text-yellow-600 mb-4 flex items-center gap-2 text-lg"><Icon name="alert-triangle" size={20}/> 旅遊小叮嚀</h3>
                            <ul className="space-y-3 text-gray-600">
                                <li className="flex gap-3 items-start"><Icon name="car" size={18} className="mt-0.5 text-blue-500 flex-shrink-0"/> 日本車輛靠左行駛，過馬路先看右再看左。</li>
                                <li className="flex gap-3 items-start"><Icon name="octagon" size={18} className="mt-0.5 text-red-500 flex-shrink-0"/> 自駕請嚴格遵守速限，"止まれ"標誌務必完全停止。</li>
                                <li className="flex gap-3 items-start"><Icon name="ban" size={18} className="mt-0.5 text-gray-500 flex-shrink-0"/> 禁止攜帶肉類製品入境日本。</li>
                                <li className="flex gap-3 items-start"><Icon name="cigarette-off" size={18} className="mt-0.5 text-gray-500 flex-shrink-0"/> 大部分室內公共場所及街道禁止吸煙。</li>
                                <li className="flex gap-3 items-start"><Icon name="credit-card" size={18} className="mt-0.5 text-blue-500 flex-shrink-0"/> 結帳時將現金或信用卡放在櫃檯的小盤子上。</li>
                            </ul>
                        </div>
                    </div>
                </div>
            );
        };

        // --- 6. Settings View ---
        const SettingsView = ({ travelers, setTravelers, setExpenses, resetToImport, days, events }) => {
            const [newName, setNewName] = useState('');

            const addTraveler = () => {
                if (newName && !travelers.includes(newName)) {
                    setTravelers([...travelers, newName]);
                    setNewName('');
                }
            };

            const removeTraveler = (name) => {
                if (travelers.length <= 1) return alert("至少需要一位旅伴");
                if (confirm(`刪除旅伴 ${name}？注意：這可能會影響歷史記帳資料顯示。`)) {
                    setTravelers(travelers.filter(t => t !== name));
                }
            };

            const clearData = () => {
                if(confirm("警告：這將清除所有 App 資料且無法復原！確定嗎？")) {
                    localStorage.clear();
                    window.location.reload();
                }
            }

            const exportToExcelClipboard = () => {
                // Removed Time column
                let text = "日期\t順序\t名稱\t地點\t備註\n";
                
                days.forEach(day => {
                    const dayEvents = events.filter(e => e.dayId === day.id).sort((a,b) => (a.order || 0) - (b.order || 0));
                    if (dayEvents.length === 0) {
                        text += `${day.date}\t-\t(無行程)\t-\t${day.note || ''}\n`;
                    } else {
                        dayEvents.forEach((e, idx) => {
                            text += `${day.date}\t${idx + 1}\t${e.title}\t${e.location || ''}\t${e.note || ''}\n`;
                        });
                    }
                });

                navigator.clipboard.writeText(text).then(() => {
                    alert("行程已複製！\n請開啟 Google Sheet 或 Excel，按下 Ctrl+V 貼上即可。");
                }, (err) => {
                    alert("複製失敗，請手動複製: " + err);
                });
            };

            return (
                <div className="p-4 md:p-8 space-y-8 max-w-3xl mx-auto">
                    <h2 className="text-2xl font-bold text-gray-800 hidden md:block border-b pb-4">設定管理</h2>

                    <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 md:p-8">
                        <div className="mb-6">
                            <h3 className="font-bold text-xl text-gray-800 mb-2">旅伴管理</h3>
                            <p className="text-gray-500 text-sm">在此新增或移除旅伴，這些成員將會出現在分帳選項中。</p>
                        </div>
                        
                        <div className="flex gap-3 mb-6">
                            <input 
                                type="text" 
                                placeholder="輸入名字..." 
                                className="border border-gray-300 rounded-lg p-3 flex-1 focus:ring-2 ring-blue-100 outline-none transition"
                                value={newName}
                                onChange={e => setNewName(e.target.value)}
                                onKeyDown={e => e.key === 'Enter' && addTraveler()}
                            />
                            <button onClick={addTraveler} className="bg-blue-600 hover:bg-blue-700 text-white px-6 rounded-lg font-bold transition shadow-sm">新增</button>
                        </div>
                        
                        <div className="flex flex-wrap gap-3">
                            {travelers.map(t => (
                                <div key={t} className="bg-blue-50 text-blue-700 px-4 py-2 rounded-full flex items-center gap-3 text-sm font-bold border border-blue-100 shadow-sm">
                                    <div className="w-6 h-6 rounded-full bg-blue-200 flex items-center justify-center text-xs">{t[0]}</div>
                                    {t}
                                    <button onClick={() => removeTraveler(t)} className="text-blue-300 hover:text-red-500 transition-colors bg-white rounded-full p-0.5"><Icon name="x" size={14}/></button>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 md:p-8 space-y-4">
                         <div>
                            <h3 className="font-bold text-xl text-gray-800 mb-2 flex items-center gap-2"><Icon name="table" size={20}/> 資料匯出與匯入</h3>
                            <p className="text-gray-500 text-sm">管理行程資料的備份與還原。</p>
                        </div>

                         <button onClick={exportToExcelClipboard} className="w-full flex items-center justify-center gap-2 px-6 py-4 bg-green-50 border border-green-200 text-green-700 font-bold rounded-xl hover:bg-green-100 hover:border-green-300 transition-all shadow-sm group">
                            <Icon name="copy" size={20} className="group-hover:scale-110 transition-transform"/>
                            匯出行程至 Excel / Google Sheet
                        </button>
                        
                        <div className="pt-4 border-t border-gray-100">
                             <p className="text-gray-500 text-sm mb-3">如果畫面行程沒有自動更新，請點擊下方按鈕強制載入我們為您設定的無時間序行程。</p>
                            <button onClick={resetToImport} className="w-full md:w-auto px-6 py-3 bg-white border border-blue-200 text-blue-600 font-bold rounded-lg hover:bg-blue-50 transition-all shadow-sm">
                                重新載入專屬預設行程 (無時間序版)
                            </button>
                        </div>
                    </div>

                    <div className="bg-red-50 rounded-2xl shadow-sm border border-red-100 p-6 md:p-8">
                        <h3 className="font-bold text-red-700 mb-2 flex items-center gap-2"><Icon name="alert-octagon" size={20}/> 危險區域</h3>
                        <p className="text-red-600/80 text-sm mb-4">清除所有資料將無法復原，請謹慎操作。</p>
                        <button onClick={clearData} className="w-full md:w-auto px-6 py-3 bg-white border border-red-200 text-red-600 font-bold rounded-lg hover:bg-red-600 hover:text-white transition-all shadow-sm">
                            清除所有資料並重置
                        </button>
                    </div>
                    
                    <div className="text-center text-xs text-gray-400 mt-8">
                        沖繩旅遊小幫手 專屬行程版 (無時間序)<br/>
                        資料儲存於本機瀏覽器 (localStorage)
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
